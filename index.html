<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agustín & Mirian — La Boda</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@100;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-vanguardia: #2d3b1e;   /* Verde Oliva Obscuro Editorial */
            --color-acento: #a38446;       /* Dorado Mate / Latón */
            --color-fondo-claro: #f5f4f0;  /* Piedra Lino */
            --color-bloque-muro: #ffffff;  /* Blanco Puro */
            --texto-editorial: #111111;    /* Negro Absoluto */
            --fuente-editorial: 'Italiana', serif;
            --fuente-datos: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: var(--fuente-datos);
            background-color: var(--color-fondo-claro);
            color: var(--texto-editorial);
            line-height: 1.7;
            overflow-x: hidden;
            position: relative;
        }

        /* --- EFECTO HOJAS CAYENDO --- */
        #contenedor-hojas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }

        .hoja {
            position: absolute;
            background-size: contain;
            background-no-repeat: no-repeat;
            opacity: 0.6;
            pointer-events: none;
            animation: caer linear infinite;
        }

        @keyframes caer {
            0% {
                transform: translateY(-50px) rotate(0deg) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) translateX(100px);
                opacity: 0;
            }
        }

        /* --- PORTADA ASIMÉTRICA --- */
        .hero-editorial {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #111;
            overflow: hidden;
        }

        .hero-imagen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.25)), 
                        url('https://lh3.googleusercontent.com/d/1KU303ozfyF-n_yJYZ-ID0G4oZGSDmYry') no-repeat center center/cover;
            z-index: 1;
            transform: scale(1.02);
            animation: entradaSuave 2s ease-out forwards;
        }

        @keyframes entradaSuave {
            from { transform: scale(1.08); opacity: 0.8; }
            to { transform: scale(1.02); opacity: 1; }
        }

        .hero-texto-contenedor {
            position: absolute;
            bottom: 80px; left: 5%;
            z-index: 2;
            text-align: left;
            max-width: 90%;
        }

        .hero-texto-contenedor span {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.95);
            display: block;
            margin-bottom: 15px;
            animation: fadin 1.2s ease-out;
        }

        .hero-texto-contenedor h1 {
            font-family: var(--fuente-editorial);
            font-size: 6rem;
            font-weight: 400;
            color: #ffffff;
            line-height: 1.1;
            letter-spacing: -1px;
            text-shadow: 0 4px 30px rgba(0,0,0,0.35);
            animation: fadin 1.5s ease-out;
        }

        .hero-texto-contenedor .fecha-badge {
            margin-top: 35px;
            font-size: 2.6rem;
            letter-spacing: 8px;
            color: var(--texto-editorial);
            font-weight: 500;
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.97);
            padding: 14px 45px;
            border-left: 6px solid var(--color-acento);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            font-family: var(--fuente-editorial);
            animation: fadinUp 1.8s ease-out;
        }

        @keyframes fadin {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadinUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- LAYOUT SPLIT (RELOJ) --- */
        .seccion-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 80vh;
            background: var(--color-bloque-muro);
        }

        .split-izq {
            padding: 10% 12%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
            border-right: 1px solid #e8e6e0;
        }

        .split-izq h2 {
            font-family: var(--fuente-editorial);
            font-size: 3.5rem;
            color: var(--color-vanguardia);
            line-height: 1.1;
            margin-bottom: 30px;
        }

        .split-der {
            background: linear-gradient(rgba(245, 244, 240, 0.35), rgba(245, 244, 240, 0.35)),
                        url('https://lh3.googleusercontent.com/d/1IDRbAhVbwe6J_CLx1PbfZgXIk1diQsza') no-repeat center center/cover;
            display: flex;
            align-items: flex-end;
            padding: 40px;
        }

        .contador-moderno {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 20px 45px rgba(0,0,0,0.05);
        }

        .caja-reloj h4 {
            font-family: var(--fuente-editorial);
            font-size: 3.5rem;
            font-weight: 400;
            color: var(--color-vanguardia);
            line-height: 1;
            transition: transform 0.3s ease;
        }

        .caja-reloj:hover h4 {
            transform: translateY(-3px);
            color: var(--color-acento);
        }

        .caja-reloj p {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
            margin-top: 10px;
            font-weight: 600;
        }

        /* --- DESTINO Y UBICACIÓN --- */
        .seccion-destino {
            padding: 140px 5%;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 45% 55%;
            gap: 60px;
            align-items: center;
        }

        .destino-info { text-align: left; }
        .destino-info h3 {
            font-family: var(--fuente-editorial);
            font-size: 3.2rem;
            color: var(--color-vanguardia);
            margin-bottom: 25px;
        }

        .destino-info .hora-tag {
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: var(--color-acento);
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .marco-editorial-foto {
            position: relative;
            box-shadow: 25px 25px 0px var(--color-vanguardia);
            overflow: hidden;
            transition: box-shadow 0.4s ease;
        }

        .marco-editorial-foto img { 
            width: 100%; 
            display: block; 
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

            transform: scale(1
